[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sql-monitor-agent"
version = "0.1.0"
description = "Agentic monitoring and troubleshooting for Snowflake, PostgreSQL, MySQL and SQL Server"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "anthropic>=0.70",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "apscheduler>=3.10,<4",
  "sqlglot>=25.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
mssql = ["pyodbc>=5.0"]
snowflake = ["snowflake-connector-python>=3.10"]
all = ["psycopg[binary]>=3.1", "pymysql>=1.1", "pyodbc>=5.0", "snowflake-connector-python>=3.10"]
dev = ["pytest>=8.0"]

[project.scripts]
monitor = "monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
monitor = ["api/static/*"]

[tool.ruff]
line-length = 120

[tool.pylint.format]
max-line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
