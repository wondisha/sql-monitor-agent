<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL Monitor Agent</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #5d6677; --border: #dfe3ea;
    --accent: #2f6feb; --p1: #b42318; --p2: #d9480f; --p3: #b7791f; --p4: #2f6feb; --ok: #2e7d32;
    --code: #f0f2f5;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #11141a; --panel: #1a1f27; --text: #e6e9ef; --muted: #9aa3b2; --border: #2b323d;
            --accent: #6c9cff; --code: #232a35; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, -apple-system, Segoe UI, sans-serif; background: var(--bg); color: var(--text); }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--panel);
           border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; }
  nav button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; color: var(--muted); cursor: pointer; font: inherit; }
  nav button.active { background: var(--code); color: var(--text); font-weight: 600; }
  #who { margin-left: auto; color: var(--muted); font-size: 13px; }
  main { padding: 20px; max-width: 1200px; margin: 0 auto; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .03em; }
  tr.click { cursor: pointer; } tr.click:hover { background: var(--code); }
  .sev { font-weight: 700; padding: 1px 6px; border-radius: 4px; color: #fff; font-size: 12px; }
  .P1 { background: var(--p1); } .P2 { background: var(--p2); } .P3 { background: var(--p3); } .P4 { background: var(--p4); }
  .pill { padding: 1px 8px; border-radius: 10px; background: var(--code); font-size: 12px; }
  pre, code { background: var(--code); border-radius: 6px; font: 12px/1.45 ui-monospace, Consolas, monospace; }
  pre { padding: 10px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; }
  button.btn { border: 1px solid var(--border); background: var(--panel); color: var(--text); padding: 5px 12px;
               border-radius: 6px; cursor: pointer; font: inherit; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--p1); }
  .muted { color: var(--muted); } .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  textarea, input { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: var(--panel); color: var(--text); font: inherit; }
  .banner { padding: 10px 14px; border-radius: 6px; background: #fff4e5; color: #8a4b00; margin-bottom: 12px; }
  @media (prefers-color-scheme: dark) { .banner { background: #3a2a10; color: #ffcf8a; } }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>SQL Monitor Agent</h1>
  <nav id="tabs">
    <button data-tab="incidents" class="active">Incidents</button>
    <button data-tab="approvals">Approvals</button>
    <button data-tab="governance">User cleanup</button>
    <button data-tab="targets">Targets</button>
    <button data-tab="ask">Ask the agent</button>
    <button data-tab="audit">Audit log</button>
  </nav>
  <span id="who"></span>
</header>
<main id="view"></main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let TOKEN = null, ME = null, TAB = "incidents";
try { TOKEN = localStorage.getItem("monitor_token"); } catch (e) {}

async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "Authorization": "Bearer " + TOKEN, "Content-Type": "application/json", ...(opts.headers || {}) } });
  if (r.status === 401) { askToken(); throw new Error("unauthorized"); }
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  return body;
}
function askToken() {
  const t = prompt("API token (from MONITOR_USERS):");
  if (t) { TOKEN = t.trim(); try { localStorage.setItem("monitor_token", TOKEN); } catch (e) {} location.reload(); }
}
const isApprover = () => ME && ME.role === "approver";
const sev = (s) => `<span class="sev ${esc(s)}">${esc(s)}</span>`;
const json = (o) => `<pre>${esc(JSON.stringify(o, null, 2))}</pre>`;

async function renderIncidents() {
  const list = await api("/api/incidents?limit=200");
  $("#view").innerHTML = `<div class="card table-wrap"><table><thead><tr><th>#</th><th>Sev</th><th>Target</th><th>Incident</th>
    <th>Status</th><th>AI</th><th>Opened</th></tr></thead><tbody>${list.map(i => `
    <tr class="click" data-id="${i.id}"><td>${i.id}</td><td>${sev(i.severity)}</td><td>${esc(i.target)}</td>
    <td>${esc(i.title)}${i.summary ? `<div class="muted">${esc(i.summary)}</div>` : ""}</td>
    <td><span class="pill">${esc(i.status)}</span></td><td><span class="pill">${esc(i.rca_status)}</span></td>
    <td class="muted">${esc(i.opened_at)}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No incidents yet.</td></tr>`}
    </tbody></table></div>`;
  document.querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => { location.hash = "incident-" + tr.dataset.id; });
}

async function renderIncident(id) {
  const i = await api("/api/incidents/" + id);
  const r = i.rca;
  $("#view").innerHTML = `
    <p><a href="#" id="back">&larr; All incidents</a></p>
    <div class="card"><div class="row">${sev(i.severity)}<strong>${esc(i.title)}</strong><span class="pill">${esc(i.status)}</span></div>
      <p class="muted">${esc(i.target)} (${esc(i.engine)}) · rule ${esc(i.rule_id)} · opened ${esc(i.opened_at)} · seen ${i.event_count}×</p>
      ${isApprover() ? `<div class="row"><button class="btn" id="reinv">Re-investigate</button>
        ${i.status !== "resolved" ? `<button class="btn" id="resolve">Mark resolved</button>` : ""}</div>` : ""}
    </div>
    <div class="card"><h3>Root-cause analysis <span class="pill">${esc(i.rca_status)}</span></h3>
      ${r ? `<p><strong>${esc(r.summary)}</strong></p><p><b>Root cause:</b> ${esc(r.root_cause)}</p>
        <p><b>Impact:</b> ${esc(r.impact)} · <b>Confidence:</b> ${esc(r.confidence)}</p>
        <h4>Evidence</h4><ul>${(r.evidence || []).map(e => `<li>${esc(e.finding)} <span class="muted">(${esc(e.source_tool)})</span></li>`).join("")}</ul>
        ${(r.recommendations || []).length ? `<h4>Recommendations</h4><ul>${r.recommendations.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}
        ${(r.follow_up_checks || []).length ? `<h4>Follow-up checks</h4><ul>${r.follow_up_checks.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}`
        : i.rca_error ? `<pre>${esc(i.rca_error)}</pre>` : `<p class="muted">No RCA yet.</p>`}
    </div>
    <div class="card"><h3>Proposed actions</h3>${i.actions.length ? i.actions.map(actionCard).join("") : `<p class="muted">None.</p>`}</div>
    <div class="card"><h3>Context</h3>${json(i.context)}</div>
    <div class="card"><h3>Timeline</h3><table>${i.events.map(e => `<tr><td class="muted">${esc(e.ts)}</td><td>${esc(e.kind)}</td>
      <td><code>${esc(JSON.stringify(e.detail))}</code></td></tr>`).join("")}</table></div>`;
  $("#back").onclick = (ev) => { ev.preventDefault(); location.hash = ""; };
  if ($("#reinv")) $("#reinv").onclick = async () => { await api(`/api/incidents/${id}/investigate`, { method: "POST" }); alert("Investigation queued"); };
  if ($("#resolve")) $("#resolve").onclick = async () => { await api(`/api/incidents/${id}/resolve`, { method: "POST", body: JSON.stringify({ reason: prompt("Note (optional)") || "" }) }); renderIncident(id); };
  bindActionButtons(() => renderIncident(id));
}

function actionCard(a) {
  return `<div class="card"><div class="row"><strong>${esc(a.action_type)}</strong><span class="pill">${esc(a.status)}</span>
    <span class="pill">risk: ${esc(a.risk)}</span><span class="muted">${esc(a.target)}${a.incident_id ? ` · incident #${a.incident_id}` : ""}</span></div>
    ${a.rendered_sql ? `<pre>${esc(a.rendered_sql)}</pre>` : ""}
    <p>${esc(a.rationale)}</p>${a.rollback ? `<p class="muted"><b>Rollback:</b> ${esc(a.rollback)}</p>` : ""}
    ${a.result ? json(a.result) : ""}
    ${a.status === "proposed" && isApprover() ? `<div class="row">
      <button class="btn" data-preview="${a.id}">Preview</button>
      <button class="btn primary" data-approve="${a.id}">Approve &amp; run</button>
      <button class="btn danger" data-reject="${a.id}">Reject</button></div><div id="pv-${a.id}"></div>` : ""}</div>`;
}
function bindActionButtons(refresh) {
  document.querySelectorAll("[data-preview]").forEach(b => b.onclick = async () => {
    $("#pv-" + b.dataset.preview).innerHTML = json(await api(`/api/actions/${b.dataset.preview}/preview`)); });
  document.querySelectorAll("[data-approve]").forEach(b => b.onclick = async () => {
    if (!confirm("Run this action now against the target?")) return;
    try { await api(`/api/actions/${b.dataset.approve}/approve`, { method: "POST" }); } catch (e) { alert(e.message); }
    refresh(); });
  document.querySelectorAll("[data-reject]").forEach(b => b.onclick = async () => {
    await api(`/api/actions/${b.dataset.reject}/reject`, { method: "POST", body: JSON.stringify({ reason: prompt("Reason") || "" }) });
    refresh(); });
}

async function renderApprovals() {
  const list = await api("/api/actions?status=proposed");
  $("#view").innerHTML = list.length ? list.map(actionCard).join("") : `<div class="card muted">Nothing waiting for approval.</div>`;
  bindActionButtons(renderApprovals);
}

async function renderGovernance() {
  const { dry_run, cases } = await api("/api/governance/cases");
  const btns = (c) => !isApprover() ? "" :
    c.state === "flagged" ? `<button class="btn primary" data-gov="approve" data-id="${c.id}">Approve disable</button>
                             <button class="btn" data-gov="keep" data-id="${c.id}">Keep</button>` :
    (c.state === "disabled" || c.state === "dropped") ? `<button class="btn" data-gov="restore" data-id="${c.id}">Restore</button>` : "";
  $("#view").innerHTML = `${dry_run ? `<div class="banner">Dry-run mode: approvals record the planned SQL in the audit log but change nothing in Snowflake. Set <code>dry_run: false</code> in config/governance.yaml to act.</div>` : ""}
    <div class="card"><div class="row"><strong>Snowflake inactive users</strong>
      ${isApprover() ? `<button class="btn" id="govrun">Run scan now</button>` : ""}</div>
      <p class="muted">Flagged → approve → snapshot + disable → grace period → revoke roles + drop. Re-enabling a user during the grace period cancels the drop.</p></div>
    <div class="card table-wrap"><table><thead><tr><th>User</th><th>Target</th><th>State</th><th>Why</th><th>Roles</th><th>Dates</th><th></th></tr></thead><tbody>
    ${cases.map(c => `<tr><td><strong>${esc(c.user_name)}</strong></td><td>${esc(c.target)}</td><td><span class="pill">${esc(c.state)}</span>
      ${c.error ? `<div class="muted">${esc(c.error)}</div>` : ""}</td><td>${esc(c.reason)}</td>
      <td>${esc((c.roles || []).join(", "))}${(c.orphaned_roles || []).length ? `<div class="muted">orphaned: ${esc(c.orphaned_roles.join(", "))}</div>` : ""}</td>
      <td class="muted">flagged ${esc(c.flagged_at)}${c.disabled_at ? `<br>disabled ${esc(c.disabled_at)}` : ""}${c.dropped_at ? `<br>dropped ${esc(c.dropped_at)}` : ""}${c.keep_until ? `<br>keep until ${esc(c.keep_until)}` : ""}</td>
      <td class="row">${btns(c)}</td></tr>`).join("") || `<tr><td colspan="7" class="muted">No cases yet.</td></tr>`}</tbody></table></div>`;
  if ($("#govrun")) $("#govrun").onclick = async () => { $("#govrun").disabled = true; try { alert(JSON.stringify(await api("/api/governance/run", { method: "POST" }), null, 2)); } catch (e) { alert(e.message); } renderGovernance(); };
  document.querySelectorAll("[data-gov]").forEach(b => b.onclick = async () => {
    const act = b.dataset.gov;
    if (act === "approve" && !confirm("Snapshot grants and disable this user now?")) return;
    if (act === "restore" && !confirm("Re-enable / re-create this user and re-grant its roles?")) return;
    const body = act === "keep" ? JSON.stringify({ reason: prompt("Why keep this user?") || "" }) : undefined;
    try { await api(`/api/governance/cases/${b.dataset.id}/${act}`, { method: "POST", body }); } catch (e) { alert(e.message); }
    renderGovernance(); });
}

async function renderTargets() {
  const list = await api("/api/targets");
  $("#view").innerHTML = `
    ${isApprover() ? `<div class="row" style="margin-bottom:12px"><button class="btn primary" id="addsrv">+ Add server</button>
      <span class="muted">Servers from config/targets.yaml are edited in that file; servers added here can be removed here.</span></div>
      <div id="addform"></div>` : ""}
    <div class="grid">${list.map(t => `<div class="card"><div class="row"><strong>${esc(t.name)}</strong>
    <span class="pill">${esc(t.engine)}</span><span class="pill" style="color:${t.healthy ? "var(--ok)" : "var(--p1)"}">${t.healthy ? "reachable" : "not collected yet / unreachable"}</span></div>
    <p class="muted">open incidents: ${t.open_incidents} · last sample ${esc(t.last_sample || "–")}<br>
      ${t.source === "ui" ? "added from dashboard" : "from config/targets.yaml"} · ${t.has_executor ? "executor login set" : "no executor login (actions can't run)"}</p>
    ${t.source === "ui" && isApprover() ? `<button class="btn danger" data-rm="${esc(t.name)}">Remove</button>` : ""}
    <table>${Object.entries(t.latest).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table></div>`).join("")}</div>`;
  if ($("#addsrv")) $("#addsrv").onclick = showAddForm;
  document.querySelectorAll("[data-rm]").forEach(b => b.onclick = async () => {
    if (!confirm(`Stop monitoring ${b.dataset.rm} and delete its saved passwords?`)) return;
    try { await api("/api/targets/" + encodeURIComponent(b.dataset.rm), { method: "DELETE" }); } catch (e) { alert(e.message); }
    renderTargets(); });
}

let SCHEMA = null;
async function showAddForm() {
  SCHEMA = SCHEMA || await api("/api/targets/schema");
  const engines = { postgres: "PostgreSQL", mysql: "MySQL", mssql: "SQL Server", snowflake: "Snowflake" };
  const input = (prefix, f) => {
    const id = `${prefix}-${f.key}`, req = f.required ? " *" : "";
    if (f.kind === "bool") return `<label class="row"><input type="checkbox" id="${id}" style="width:auto" ${f.default ? "checked" : ""}> ${esc(f.label)}</label>`;
    if (f.kind.startsWith("select:")) return `<label>${esc(f.label)}${req}<select id="${id}" style="width:100%;padding:8px">${f.kind.slice(7).split(",").map(o =>
      `<option ${o === f.default ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>`;
    return `<label>${esc(f.label)}${req}<input id="${id}" type="${f.kind === "password" ? "password" : f.kind === "number" ? "number" : "text"}" value="${esc(f.default ?? "")}" autocomplete="off"></label>`;
  };
  const draw = (engine) => {
    const s = SCHEMA[engine];
    $("#addform").innerHTML = `<div class="card"><h3>Add server</h3>
      <div class="grid">
        <label>Name *<input id="f-name" placeholder="e.g. prod-sql01" autocomplete="off"></label>
        <label>Engine<select id="f-engine" style="width:100%;padding:8px">${Object.entries(engines).map(([k, v]) =>
          `<option value="${k}" ${k === engine ? "selected" : ""}>${v}</option>`).join("")}</select></label>
        ${s.connection.map(f => input("c", f)).join("")}
        ${engine === "snowflake" ? `<label>Max warehouse size for approved resizes<input id="f-maxwh" value="LARGE"></label>` : ""}
      </div>
      <h4>Monitor login (read-only)</h4><div class="grid">${s.login.map(f => input("m", f)).join("")}</div>
      <h4>Executor login (optional, used only after you approve a fix)</h4>
      <p class="muted">Leave the user empty to monitor only. ${engine === "snowflake" ? "Use the GOV_EXECUTOR user from docs/snowflake_setup.sql." : "Use a separate, more privileged login."}</p>
      <div class="grid">${s.login.map(f => input("x", { ...f, required: false })).join("")}</div>
      <p class="muted">Passwords are saved to .env, never to the YAML file. ${engine === "snowflake" ? "Key files stay where they are; only the path is saved." : ""}</p>
      <div class="row"><button class="btn" id="f-test">Test connection</button><button class="btn primary" id="f-save">Save &amp; start monitoring</button>
        <button class="btn" id="f-cancel">Cancel</button><span id="f-status" class="muted"></span></div>
      <div id="f-result"></div></div>`;
    $("#f-engine").onchange = () => { const n = $("#f-name").value; draw($("#f-engine").value); $("#f-name").value = n; };
    $("#f-cancel").onclick = () => { $("#addform").innerHTML = ""; };
    $("#f-test").onclick = () => submit(engine, false);
    $("#f-save").onclick = () => submit(engine, true);
  };
  const collect = (engine) => {
    const s = SCHEMA[engine], val = (id, f) => { const el = $("#" + id); return f.kind === "bool" ? el.checked : el.value; };
    const obj = (prefix, fields) => Object.fromEntries(fields.map(f => [f.key, val(`${prefix}-${f.key}`, f)]));
    return { name: $("#f-name").value, engine, connection: obj("c", s.connection), monitor: obj("m", s.login),
             executor: obj("x", s.login), max_warehouse_size: $("#f-maxwh") ? $("#f-maxwh").value : undefined };
  };
  const submit = async (engine, save) => {
    $("#f-status").textContent = save ? "Testing and saving…" : "Testing…"; $("#f-result").innerHTML = "";
    try {
      const r = await api(save ? "/api/targets" : "/api/targets/test", { method: "POST", body: JSON.stringify(collect(engine)) });
      const t = save ? r.test : r;
      const line = (label, x) => `<p><b>${label}:</b> ${x.ok === true ? `<span style="color:var(--ok)">OK</span>${x.metrics_collected ? ` (${x.metrics_collected} metrics)` : ""}`
        : x.ok === null ? `<span class="muted">${esc(x.note)}</span>` : `<span style="color:var(--p1)">failed</span> <code>${esc(x.error)}</code>`}</p>`;
      $("#f-result").innerHTML = line("Monitor login", t.monitor) + line("Executor login", t.executor);
      if (save) { $("#f-status").textContent = `Added ${r.added}. First readings arrive within a minute.`; setTimeout(renderTargets, 2500); }
      else $("#f-status").textContent = "";
    } catch (e) { $("#f-status").textContent = ""; $("#f-result").innerHTML = `<p style="color:var(--p1)">${esc(e.message)}</p>`; }
  };
  draw("postgres");
}

async function renderAsk() {
  $("#view").innerHTML = `<div class="card"><p class="muted">Ask a question about the fleet. The agent uses read-only tools; it cannot change anything.</p>
    <textarea id="q" rows="3" placeholder="e.g. Why is lab-postgres slow right now?"></textarea>
    <div class="row" style="margin-top:8px"><button class="btn primary" id="ask">Ask</button><span id="st" class="muted"></span></div></div><div id="ans"></div>`;
  $("#ask").onclick = async () => {
    $("#st").textContent = "Investigating…"; $("#ask").disabled = true;
    try { const r = await api("/api/chat", { method: "POST", body: JSON.stringify({ question: $("#q").value }) });
          $("#ans").innerHTML = `<div class="card"><pre>${esc(r.answer)}</pre></div>` + $("#ans").innerHTML; }
    catch (e) { $("#ans").innerHTML = `<div class="card"><pre>${esc(e.message)}</pre></div>`; }
    $("#st").textContent = ""; $("#ask").disabled = false; };
}

async function renderAudit() {
  const list = await api("/api/audit?limit=300");
  $("#view").innerHTML = `<div class="card table-wrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Event</th><th>Target</th><th>Detail</th></tr></thead><tbody>
    ${list.map(a => `<tr><td class="muted">${esc(a.ts)}</td><td>${esc(a.actor)}</td><td>${esc(a.event)}</td><td>${esc(a.target)}</td>
      <td><code>${esc(JSON.stringify(a.detail).slice(0, 400))}</code></td></tr>`).join("")}</tbody></table></div>`;
}

const RENDER = { incidents: renderIncidents, approvals: renderApprovals, governance: renderGovernance, targets: renderTargets, ask: renderAsk, audit: renderAudit };
async function route() {
  const m = location.hash.match(/^#incident-(\d+)/);
  try { if (m) await renderIncident(m[1]); else await RENDER[TAB](); }
  catch (e) { $("#view").innerHTML = `<div class="card"><pre>${esc(e.message)}</pre></div>`; }
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("active", x === b));
  TAB = b.dataset.tab; if (location.hash) location.hash = ""; else route(); });
window.addEventListener("hashchange", route);

(async () => {
  if (!TOKEN) return askToken();
  try { ME = await api("/api/me"); $("#who").textContent = `${ME.name} (${ME.role})`; } catch (e) { return; }
  route();
  setInterval(() => {
    const formOpen = $("#addform") && $("#addform").innerHTML.trim();   // don't wipe a half-filled form
    if (!location.hash && !formOpen && ["incidents", "approvals", "targets"].includes(TAB)) route();
  }, 30000);
})();
</script>
</body>
</html>
